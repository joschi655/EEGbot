<!-- @dsCard group="Colors" viewport="700x210" name="Status — restrained" subtitle="White + Klein blue led; red only for overdue" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px 32px; background: var(--surface-card); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chip { display:flex; align-items:center; gap:7px; padding: 8px 14px; border-radius: var(--radius-full); font: var(--font-label); justify-content:center; }
  .dot { width:7px; height:7px; border-radius:var(--radius-full); background:currentColor; }
  .meta { font: var(--font-caption); color: var(--text-muted); text-align:center; }
  .meta b { color: var(--text-secondary); font-weight:600; }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <div class="chip" style="background:var(--status-compliant-bg);color:var(--status-compliant-fg);border:1px solid var(--status-compliant-bd)"><span class="dot"></span>Konform</div>
      <div class="meta"><b>Klein blue</b><br>compliant · the norm</div>
    </div>
    <div class="col">
      <div class="chip" style="background:var(--status-pending-bg);color:var(--status-pending-fg);border:1px solid var(--status-pending-bd)"><span class="dot"></span>Frist offen</div>
      <div class="meta"><b>Neutral</b><br>pending · awaiting action</div>
    </div>
    <div class="col">
      <div class="chip" style="background:var(--status-overdue-bg);color:var(--status-overdue-fg);border:1px solid var(--status-overdue-bd)"><span class="dot"></span>Überfällig</div>
      <div class="meta"><b>Red — the only alarm</b><br>overdue · used sparingly</div>
    </div>
    <div class="col">
      <div class="chip" style="background:var(--status-neutral-bg);color:var(--status-neutral-fg);border:1px solid var(--status-neutral-bd)"><span class="dot"></span>Entwurf</div>
      <div class="meta"><b>Neutral soft</b><br>draft</div>
    </div>
  </div>
</body>
</html>
