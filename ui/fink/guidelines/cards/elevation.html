<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 30px 32px; background: var(--surface-page); display:flex; gap: 22px; align-items:center; }
  .e { width: 110px; height: 76px; background: var(--surface-card); border-radius: var(--radius-lg); display:flex; align-items:center; justify-content:center; font: var(--font-data); font-size: 11px; color: var(--text-secondary); border: 1px solid var(--border-subtle); }
</style>
</head>
<body>
  <div class="e" style="box-shadow:var(--shadow-xs)">xs</div>
  <div class="e" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="e" style="box-shadow:var(--shadow-md)">md</div>
  <div class="e" style="box-shadow:var(--shadow-lg)">lg</div>
  <div class="e" style="box-shadow:var(--shadow-xl)">xl</div>
</body>
</html>
