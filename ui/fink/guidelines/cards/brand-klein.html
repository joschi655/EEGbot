<!-- @dsCard group="Brand" viewport="700x220" name="Klein statement" subtitle="IKB as the brand's one bold gesture" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--klein-600); height: 220px; display:flex; align-items:center; padding: 0 44px; position: relative; overflow: hidden; }
  .outline { position:absolute; right: -10px; bottom: -34px; font-family: var(--font-outline); font-size: 200px; line-height: 1; color: rgba(255,255,255,.13); }
  .copy { position: relative; max-width: 60%; }
  .eyebrow { font: var(--weight-semibold) 11px/1 var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 12px; }
  h2 { font: var(--weight-bold) 30px/1.15 var(--font-sans); letter-spacing: -0.02em; color: #fff; margin: 0; }
  .hex { font: var(--font-data); font-size: 11px; color: rgba(255,255,255,.7); margin-top: 14px; }
</style>
</head>
<body>
  <div class="outline">fink</div>
  <div class="copy">
    <div class="eyebrow">International Klein Blue</div>
    <h2>One saturated blue, used with intent.<br>Everything else stays quiet.</h2>
    <div class="hex">#1213BE · klein-600 · the only hero color</div>
  </div>
</body>
</html>
