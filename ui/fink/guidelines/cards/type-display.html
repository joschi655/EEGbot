<!-- @dsCard group="Type" viewport="700x300" name="Display & headings" subtitle="Gilmer — display, H1, H2, H3" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: 0; }
  .spec { font: var(--font-data); color: var(--text-muted); white-space: nowrap; min-width: 92px; }
  .d  { font: var(--font-display); letter-spacing: var(--tracking-tighter); color: var(--text-primary); }
  .h1 { font: var(--font-h1); letter-spacing: var(--tracking-tight); color: var(--text-primary); }
  .h2 { font: var(--font-h2); color: var(--text-primary); }
  .h3 { font: var(--font-h3); color: var(--text-primary); }
</style>
</head>
<body>
  <div class="row"><span class="spec">Display/48</span><span class="d">EEG-Konformität</span></div>
  <div class="row"><span class="spec">H1/30</span><span class="h1">Compliance, automated</span></div>
  <div class="row"><span class="spec">H2/24</span><span class="h2">Portfolio overview</span></div>
  <div class="row"><span class="spec">H3/20</span><span class="h3">Marktstammdatenregister</span></div>
</body>
</html>
