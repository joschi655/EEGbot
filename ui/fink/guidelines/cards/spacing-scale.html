<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing scale" subtitle="4px base grid — favor the larger step" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px 32px; background: var(--surface-card); display:flex; align-items:flex-end; gap: 14px; }
  .step { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .bar { background: var(--klein-600); border-radius: 3px; width: 100%; }
  .lbl { font: var(--font-data); font-size: 10px; color: var(--text-muted); white-space: nowrap; }
  .lbl b { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
  <div class="step"><div class="bar" style="height:4px;width:4px"></div><div class="lbl"><b>1</b> 4</div></div>
  <div class="step"><div class="bar" style="height:8px;width:8px"></div><div class="lbl"><b>2</b> 8</div></div>
  <div class="step"><div class="bar" style="height:12px;width:12px"></div><div class="lbl"><b>3</b> 12</div></div>
  <div class="step"><div class="bar" style="height:16px;width:16px"></div><div class="lbl"><b>4</b> 16</div></div>
  <div class="step"><div class="bar" style="height:20px;width:20px"></div><div class="lbl"><b>5</b> 20</div></div>
  <div class="step"><div class="bar" style="height:24px;width:24px"></div><div class="lbl"><b>6</b> 24</div></div>
  <div class="step"><div class="bar" style="height:32px;width:32px"></div><div class="lbl"><b>7</b> 32</div></div>
  <div class="step"><div class="bar" style="height:40px;width:40px"></div><div class="lbl"><b>8</b> 40</div></div>
  <div class="step"><div class="bar" style="height:48px;width:48px"></div><div class="lbl"><b>9</b> 48</div></div>
  <div class="step"><div class="bar" style="height:64px;width:64px"></div><div class="lbl"><b>10</b> 64</div></div>
</body>
</html>
