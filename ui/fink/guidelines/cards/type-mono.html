<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-card); display:flex; flex-direction:column; gap: 14px; }
  .line { display:flex; gap: 14px; align-items:baseline; }
  .k { font: var(--font-caption); color: var(--text-muted); min-width: 130px; }
  .v { font: var(--font-data); color: var(--text-primary); font-size: 14px; }
  .v .dim { color: var(--text-muted); }
  .tab { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="line"><span class="k">MaStR-Nr.</span><span class="v">SEE901134502024</span></div>

  <div class="line"><span class="k">Leistung</span><span class="v tab">12.480,00 kWp</span></div>
  <div class="line"><span class="k">Frist</span><span class="v tab">2026-07-31</span></div>
</body>
</html>
