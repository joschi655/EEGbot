<!-- @dsCard group="Colors" viewport="700x170" name="Neutrals" subtitle="Cool, faintly blue-cast gray — surfaces & ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px 32px; background: var(--surface-card); }
  .scale { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
  .sw { height: 76px; border-radius: var(--radius-sm); display: flex; align-items: flex-end; padding: 6px; border: 1px solid var(--border-default); }
  .sw .n { font: var(--font-data); font-size: 10px; }
</style>
</head>
<body>
  <div class="scale">
    <div class="sw" style="background:var(--gray-0);color:#444"><span class="n">0</span></div>
    <div class="sw" style="background:var(--gray-25);color:#444"><span class="n">25</span></div>
    <div class="sw" style="background:var(--gray-50);color:#444"><span class="n">50</span></div>
    <div class="sw" style="background:var(--gray-100);color:#444"><span class="n">100</span></div>
    <div class="sw" style="background:var(--gray-200);color:#444"><span class="n">200</span></div>
    <div class="sw" style="background:var(--gray-300);color:#444"><span class="n">300</span></div>
    <div class="sw" style="background:var(--gray-400);color:#fff"><span class="n">400</span></div>
    <div class="sw" style="background:var(--gray-500);color:#fff"><span class="n">500</span></div>
    <div class="sw" style="background:var(--gray-600);color:#fff"><span class="n">600</span></div>
    <div class="sw" style="background:var(--gray-700);color:#fff"><span class="n">700</span></div>
    <div class="sw" style="background:var(--gray-800);color:#fff"><span class="n">800</span></div>
    <div class="sw" style="background:var(--gray-900);color:#fff"><span class="n">900</span></div>
  </div>
</body>
</html>
