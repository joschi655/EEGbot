<!-- @dsCard group="Type" viewport="700x230" name="Body, label & caption" subtitle="The everyday reading styles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: 0; }
  .spec { font: var(--font-data); color: var(--text-muted); white-space: nowrap; min-width: 116px; }
  .body-lg { font: var(--font-body-lg); color: var(--text-primary); max-width: 460px; }
  .body { font: var(--font-body); color: var(--text-secondary); max-width: 460px; }
  .label { font: var(--font-label); color: var(--text-primary); }
  .caption { font: var(--font-caption); color: var(--text-muted); }
  .eyebrow { font: var(--weight-semibold) var(--text-2xs)/1 var(--font-sans); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row"><span class="spec">Body LG 15/1.65</span><span class="body-lg">Every plant in your portfolio, checked against the current EEG obligations.</span></div>
  <div class="row"><span class="spec">Body 14/1.5</span><span class="body">fink reads the regulation, maps each duty to an asset, and flags what needs filing.</span></div>
  <div class="row"><span class="spec">Label 13/500</span><span class="label">Anlagenname</span></div>
  <div class="row"><span class="spec">Caption 12</span><span class="caption">Zuletzt geprüft vor 4 Stunden</span></div>
  <div class="row"><span class="spec">Eyebrow 11</span><span class="eyebrow">Marktstammdatenregister</span></div>
</body>
</html>
