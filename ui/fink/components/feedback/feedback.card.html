<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 26px 30px; background: var(--surface-page); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:12px; align-items:center; margin-top:4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Banner, Tooltip, Dialog, Button, IconButton } = window.FinkDesignSystem_4f2014;
const I = (n) => <i data-lucide={n}></i>;

function Demo() {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => { setTimeout(() => window.lucide && lucide.createIcons(), 20); });
  return (
    <div className="stack">
      <Banner tone="overdue" title="2 Fristen überfällig"
        actions={<Button size="sm" variant="danger">Jetzt prüfen</Button>}
        onDismiss={()=>{}}>
        Solarpark Lausitz und WP Nordsee benötigen eine MaStR-Meldung.
      </Banner>
      <Banner tone="info">fink hat 12 neue Pflichten aus dem EEG 2023 erkannt.</Banner>
      <Banner tone="compliant" title="Alle Quartalsmeldungen eingereicht" />
      <div className="row">
        <Tooltip label="Letzte Prüfung: vor 4 Std." side="right">
          <IconButton variant="outline" label="Info" icon={I('info')} />
        </Tooltip>
        <Button onClick={()=>setOpen(true)}>Dialog öffnen</Button>
      </div>
      <Dialog open={open} onClose={()=>setOpen(false)}
        title="Meldung einreichen?"
        description="Die Meldung wird an das Marktstammdatenregister übermittelt."
        footer={<><Button variant="secondary" onClick={()=>setOpen(false)}>Abbrechen</Button><Button onClick={()=>setOpen(false)}>Einreichen</Button></>}>
        Bitte prüfen Sie die Angaben für Solarpark Lausitz, bevor die Meldung gesendet wird.
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
