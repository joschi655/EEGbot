<!-- @dsCard group="Components" viewport="700x180" name="Navigation — Tabs" subtitle="Underline & pill tab bars" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 28px 30px; background: var(--surface-card); display:flex; flex-direction:column; gap:24px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs } = window.FinkDesignSystem_4f2014;
const I = (n) => <i data-lucide={n}></i>;

function Demo() {
  const [a, setA] = React.useState('open');
  const [b, setB] = React.useState('overview');
  React.useEffect(() => { setTimeout(() => window.lucide && lucide.createIcons(), 20); });
  return (
    <React.Fragment>
      <Tabs value={a} onChange={setA} items={[
        { value:'all', label:'Alle Anlagen', count:48 },
        { value:'open', label:'Offene Fristen', count:7 },
        { value:'done', label:'Eingereicht' },
      ]} />
      <Tabs variant="pill" value={b} onChange={setB} items={[
        { value:'overview', label:'Übersicht', icon:I('layout-dashboard') },
        { value:'docs', label:'Dokumente', icon:I('file-text') },
        { value:'history', label:'Verlauf', icon:I('history') },
      ]} />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
