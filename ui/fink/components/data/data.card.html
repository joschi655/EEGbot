<!-- @dsCard group="Components" viewport="700x360" name="Data display" subtitle="Card, Badge, Tag, Avatar, Stat, ProgressBar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 26px 30px; background: var(--surface-page); }
  .wrap { display:grid; grid-template-columns: 1.1fr 1fr; gap:18px; align-items:start; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .lbl { font: var(--weight-semibold) 10px/1 var(--font-sans); letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin-bottom:9px; }
  .stack { display:flex; flex-direction:column; gap:16px; }
  .stats { display:flex; gap:26px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Badge, Tag, Avatar, Stat, ProgressBar, Button } = window.FinkDesignSystem_4f2014;

function Demo() {
  return (
    <div className="wrap">
      <Card variant="accent" title="Solarpark Lausitz" subtitle="12.480 kWp · Brandenburg"
        headerAction={<Badge tone="compliant" dot>Konform</Badge>}
        footer={<Button size="sm" variant="ghost">Details öffnen</Button>}>
        <div className="row">
          <Avatar name="Klima Energie GmbH" size="sm" accent />
          <div style={{font:'var(--font-caption)', color:'var(--text-muted)'}}>Betreiber · zuletzt geprüft vor 4 Std.</div>
        </div>
        <ProgressBar label="Meldepflichten erfüllt" value={3} max={4} valueFormat={(v,m)=>`${v}/${m}`} tone="compliant" />
        <div className="row">
          <Tag>§ 19 EEG</Tag><Tag accent>Photovoltaik</Tag><Tag>MaStR</Tag>
        </div>
      </Card>
      <div className="stack">
        <Card>
          <div className="stats">
            <Stat label="Konform" value="94" unit="%" delta="+2,1 %" trend="up" />
            <Stat label="Offene Fristen" value="7" delta="3 neu" trend="down" />
          </div>
        </Card>
        <div>
          <div className="lbl">Status-Badges</div>
          <div className="row">
            <Badge tone="compliant" dot>Konform</Badge>
            <Badge tone="pending" dot>Frist in 6 Tagen</Badge>
            <Badge tone="overdue" dot>Überfällig</Badge>
            <Badge tone="neutral">Entwurf</Badge>
            <Badge tone="info">KI-geprüft</Badge>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(() => window.lucide && lucide.createIcons(), 30);
</script>
</body>
</html>
