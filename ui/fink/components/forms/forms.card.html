<!-- @dsCard group="Components" viewport="700x430" name="Forms" subtitle="Button, IconButton, Input, Select, Checkbox, Switch" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 26px 30px; background: var(--surface-card); }
  .grp { display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .cols { display:grid; grid-template-columns: 1fr 1fr; gap:20px 28px; }
  .lbl { font: var(--weight-semibold) 10px/1 var(--font-sans); letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
  .stack { display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Switch } = window.FinkDesignSystem_4f2014;
const I = (n) => <i data-lucide={n}></i>;

function Demo() {
  return (
    <div className="grp">
      <div>
        <div className="lbl">Button — variants &amp; sizes</div>
        <div className="row">
          <Button iconLeft={I('check')}>Einreichen</Button>
          <Button variant="secondary">Abbrechen</Button>
          <Button variant="ghost">Details</Button>
          <Button variant="accentSoft" iconLeft={I('sparkles')}>fink fragen</Button>
          <Button variant="danger" iconLeft={I('trash-2')}>Löschen</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="row" style={{marginTop:'12px'}}>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <IconButton label="Filter" icon={I('sliders-horizontal')} />
          <IconButton variant="outline" label="Mehr" icon={I('ellipsis')} />
          <IconButton variant="solid" label="Neu" icon={I('plus')} />
        </div>
      </div>
      <div className="cols">
        <div className="stack">
          <Input label="Anlagenname" placeholder="z. B. Solarpark Lausitz" iconLeft={I('search')} />
          <Input label="Leistung" suffix="kWp" defaultValue="12.480" />
          <Input label="MaStR-Nr." error="Pflichtfeld" defaultValue="" />
        </div>
        <div className="stack">
          <Select label="Technologie" options={["Photovoltaik","Windkraft","Biomasse"]} />
          <div className="stack" style={{gap:'10px', marginTop:'2px'}}>
            <Checkbox label="Nur überfällige Anlagen" defaultChecked />
            <Checkbox label="Entwürfe einschließen" />
            <Switch label="Automatische Meldung" defaultChecked />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(() => window.lucide && lucide.createIcons(), 30);
</script>
</body>
</html>
