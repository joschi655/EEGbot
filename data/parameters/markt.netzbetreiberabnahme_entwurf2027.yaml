id: markt.netzbetreiberabnahme_entwurf2027
beschreibung: >
  SCHÄTZUNG — KEIN GELTENDES RECHT. Erwartete Vergütung der „Netzbetreiberabnahme"
  nach § 21 Abs. 1 EEG 2027-E (RefE 21.04.2026): Marktwert Solar abzüglich
  Vermarktungskosten, ohne Förderbestandteil. Branchenschätzung ~3,5 ct/kWh
  (Solarenergie-Förderverein auf Basis Enervis-Marktpreisprognose). Nur für die
  Zeitmaschinen-Demo (pipelines/demo-zeitmaschine.ts) — NICHT in Engines
  verwenden, solange das EEG 2027 nicht verkündet ist.
