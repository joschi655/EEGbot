id: verguetung.solar.teileinspeisung
beschreibung: >
  Feste Einspeisevergütung (Überschuss-/Teileinspeisung) für Gebäude-Solaranlagen
  nach § 48 Abs. 2, § 49 EEG, je IBN-Zeitfenster (Degression 1 %/6 Monate ab
  01.02.2024, § 49 Abs. 1 EEG i.d.F. Solarpaket I). Operative Werte gem.
  BNetzA-Veröffentlichung der anzulegenden Werte. Mischvergütung bei
  Leistungsstaffel anteilig (§ 48 Abs. 2: "bis einschließlich").
einheit: ct/kWh
staffelung: leistung_kwp
zeitraeume:
  - gueltig_von: "2022-07-30"
    gueltig_bis: "2024-01-31"
    wert:
      - { bis_kwp: 10, wert: 8.2 }
      - { bis_kwp: 40, wert: 7.1 }
      - { bis_kwp: 100, wert: 5.8 }
    quelle:
      bezeichnung: "EEG 2023 § 48 Abs. 2 (Werte ab 30.07.2022, Degressionsaussetzung bis 31.01.2024)"
      fundstelle: "§ 48 Abs. 2, § 49 EEG 2023"
