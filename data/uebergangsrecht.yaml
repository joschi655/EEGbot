# Fassungskette des EEG für die deterministische §100-Auflösung.
# Grundsatz (Versteinerungsklausel, § 100 Abs. 1 EEG 2023, bestätigt BGH XIII ZR 3/24,
# Urteil v. 12.11.2024): Das Vergütungsregime einer Anlage richtet sich nach der zum
# Zeitpunkt der Inbetriebnahme geltenden Fassung — unabhängig von späteren Änderungen.
#
# ACHTUNG — bewusste Grenze des deterministischen Teils:
# Selektive DURCHBRECHUNGEN (§ 100 Abs. 1a ff.: z. B. § 9 technische Vorgaben,
# § 51 Negativpreise, § 52 Sanktionen, § 6 Kommunalbeteiligung gelten auch für
# Bestandsanlagen) sind NICHT vollständig kodiert. Der Resolver liefert die
# Grundfassung + bekannte Durchbrechungs-Hinweise; die Einzelprüfung von
# Durchbrechungen ist agentisch (mit Normtext-RAG) oder juristisch zu klären.

