# Bekannte Durchbrechungen der Versteinerung — gelten (ggf. eingeschränkt) auch für
# Bestandsanlagen. Quelle: § 100 Abs. 1a ff. EEG 2023; Research-Korpus EEG-Jura.
durchbrechungen:
  - norm: "§ 52 EEG 2023"
    thema: "Sanktionen (10 €/kW/Monat)"
    hinweis: >
      Gilt über § 100 Abs. 9 EEG 2023 für ALLE Bestandsanlagen unabhängig von
      IBN-Datum, Förderstatus und Einspeisung (Clearingstelle FAQ 236).
  - norm: "§ 9 EEG 2023"
    thema: "Technische Vorgaben / Steuerbarkeit"
    hinweis: "Erstreckung auf Bestandsanlagen in Teilen, abhängig von Leistungsklasse und Stichtagen."
  - norm: "§ 51 EEG 2023"
    thema: "Negative Strompreise"
    hinweis: "Anwendbarkeit nach IBN-Datum gestaffelt; seit Solarspitzengesetz 2025 erweitert, freiwilliger Wechsel § 100 Abs. 47."
  - norm: "§ 71 EEG 2023"
    thema: "Jahresmeldung / Mitteilungspflichten"
    hinweis: "Meldepflichten gelten fassungsübergreifend; Verstoß ist §52-bewehrt."

