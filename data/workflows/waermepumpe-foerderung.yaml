id: waermepumpe-foerderung
titel: "Wärmepumpe: Förderung finden und beantragen (KfW 458 / BAFA / §35c)"
beschreibung: >
  Förder-Matching mit Boni-Berechnung, Kumulierungs-Check und Antragsweg —
  inklusive der härtesten Regel: Antrag VOR Maßnahmenbeginn.
zustaendig_wenn:
  eine:
    - { feld: fall_typ, op: eq, wert: waermepumpe }
    - { feld: massnahme.typ, op: eq, wert: waermepumpe }
start: intake_basis
schritte:
  - id: intake_basis
    titel: "Vorhaben erfassen"
    typ: nutzer_input
    benoetigte_felder:
      - { feld: massnahme.typ, frage: "Welche Maßnahme ist geplant (Wärmepumpe, Dämmung, …)?" }
      - { feld: massnahme.begonnen, frage: "Wurde schon ein Liefer-/Leistungsvertrag unterschrieben oder mit der Umsetzung begonnen?", hinweis: "Entscheidend für die Förderfähigkeit!" }
      - { feld: gebaeude.bestandsgebaeude, frage: "Bestandsgebäude oder Neubau?" }
      - { feld: antragsteller.selbstnutzend, frage: "Wohnst du selbst im Gebäude?" }
      - { feld: massnahme.ersetzt_fossile_heizung, frage: "Ersetzt die Wärmepumpe eine funktionstüchtige Öl-/Gas-/Kohle-/Nachtspeicherheizung?" }
      - { feld: antragsteller.haushaltseinkommen_eur, frage: "Liegt das zu versteuernde Haushaltseinkommen unter 40.000 €? (Falls ja: +30 % Einkommensbonus — Angabe optional)" }
    weiter:
      - zu: matching

  - id: matching
    titel: "Programme matchen"
    typ: tool
    tool:
      server: eeg-foerder
      name: programme_matchen
      args_aus_fall: { fall: . }
      ergebnis_feld: ergebnisse.programme
    weiter:
      - zu: erklaerung

  - id: erklaerung
    titel: "Match-Ergebnis erklären"
    typ: agent
    agent_aufgabe:
      beschreibung: >
        Erkläre das Matcher-Ergebnis (Eligibility-Agent-Regeln): je Programm
        passt/passt nicht + Grund, Fördersatz mit Boni-Aufschlüsselung, Antragsweg.
        Kumulierung KfW 458 vs. §35c als Entweder-oder ausweisen
        (kumulierung_pruefen). Bei massnahme.begonnen=true: erklären, was noch
        geht (§35c läuft über die Steuererklärung und kennt keinen Vor-Beginn-
        Antrag — Details zum Einzelfall: Steuerberater).
    weiter:
      - zu: dokumente

  - id: dokumente
    titel: "Dokumenten-Checkliste"
    typ: tool
    tool:
      server: eeg-foerder
      name: formular_inventar
      args_aus_fall: { fall: . }
      ergebnis_feld: ergebnisse.formulare
    weiter:
      - zu: fahrplan

  - id: fahrplan
    titel: "Deterministischer Förderfahrplan"
    typ: tool
    tool:
      server: eeg-foerder
      name: foerderfahrplan
      args_aus_fall: { fall: . }
      ergebnis_feld: ergebnisse.fahrplan
    weiter:
      - zu: abschluss

  - id: abschluss
    titel: "Fahrplan erklären"
    typ: agent
    agent_aufgabe:
      beschreibung: >
        Präsentiere ergebnisse.fahrplan (Markdown-Feld) — NICHT selbst dichten:
        Empfehlung + Boni erklären, die Reihenfolge-Warnung (Antrag VOR
        Vertragsschluss) hervorheben, human_only-Dokumentfelder als
        Experten-Aufgaben ausweisen, offene_fragen als konkrete Rückfragen an
        den Nutzer stellen. Bei standort.plz zusätzlich netzbetreiber_fuer_plz
        (eeg-daten) aufrufen und als Heuristik gekennzeichnet ergänzen.
        Disclaimer aus dem Fahrplan übernehmen.
    weiter:
      - zu: ende
quellen:
  - { bezeichnung: "KfW 458 Merkblatt; BAFA BEG EM; § 35c EStG" }
