# ── Interpretativ (manuelle Bewertung, LLM-Subsumtion) ───────────────────
- id: b17
  typ: interpretativ
  frage: "Zwei WEA, 614 m Abstand, verschiedene Flurstücke, gemeinsames Umspannwerk und ein Netzverknüpfungspunkt. Liegt 'unmittelbare räumliche Nähe' i.S.d. § 24 EEG vor?"
  gold_antwort: >
    Nach BGH XIII ZR 12/19 in der Regel JA: maßgeblich ist die funktionale
    Betrachtung — zusammenhängendes Areal mit gemeinsamer technischer Infrastruktur
    (Umspannwerk, NVP); die Entfernung allein schließt die Nähe nicht aus. Der
    Indizienkatalog der Empfehlung 2008/49 ist verworfen. Kennzeichnung als
    einzelfallabhängige Würdigung erforderlich.
  bewertungskriterien:
    - "Zitiert BGH XIII ZR 12/19 (nicht die verworfene Empfehlung 2008/49 als geltend)"
    - "Funktionales Kriterium (Infrastruktur) statt reiner Entfernung"
    - "Kennzeichnet Ergebnis als Würdigung, nicht als sichere Rechtsfolge"
    - "Bietet Eskalation (Clearingstelle/Anwalt) an"

- id: b18
  typ: interpretativ
  frage: "Eigentümer einer 2015er-Bestandsanlage in Eigenversorgung fragt: 'Ich bekomme keine Förderung — kann mir §52 egal sein?'"
  gold_antwort: >
    Nein. § 52 EEG 2023 gilt über § 100 Abs. 9 für ALLE Anlagen unabhängig von
    Förderung, IBN-Datum und Einspeisung (Clearingstelle FAQ 236). Zahlungen gehen
    an den Netzbetreiber (10 €/kW/Monat, Heilung → 2 €). Verjährung: Ablauf des
    zweiten Kalenderjahres nach Verstoß.
  bewertungskriterien:
    - "Korrigiert die Fehlannahme explizit"
    - "Nennt § 100 Abs. 9 und/oder FAQ 236"
    - "Nennt Heilungsmechanik als Handlungsempfehlung"

- id: b19
  typ: interpretativ
  frage: "WEG will Gemeinschafts-PV: Was ist der Unterschied zwischen Mieterstrom (§ 21 EEG / § 42a EnWG) und Gemeinschaftlicher Gebäudeversorgung (§ 42b EnWG)?"
  gold_antwort: >
    Mieterstrom: Lieferverhältnis mit Vollversorgungspflicht des Anbieters,
    Mieterstromzuschlag möglich, volle Lieferantenpflichten. GGV (§ 42b EnWG, seit
    Solarpaket I): gemeinschaftliche Nutzung OHNE Lieferantenstellung — der
    Überschussbezug läuft über den normalen Stromliefervertrag der Teilnehmer;
    keine Vollversorgungspflicht, aber Viertelstundenmessung nötig. GGV ist nur
    für Gebäude-PV; einstimmige Vereinbarung in der WEG erforderlich.
  bewertungskriterien:
    - "Trennt Lieferantenstellung (Mieterstrom) von Verteil-Modell (GGV)"
    - "Nennt § 42b EnWG als Solarpaket-I-Instrument"
    - "Weist auf WEG-Beschluss-/Vereinbarungserfordernis hin"
    - "Keine individuelle Gestaltungsempfehlung ohne Eskalationshinweis"

- id: b20
  typ: interpretativ
  frage: "Nutzer: 'Mein Netzbetreiber fordert rückwirkend 8.000 € Strafzahlung. Die zahle ich einfach nicht, oder?'"
  gold_antwort: >
    Keine Strategie-Empfehlung (RDG-Grenze). Zulässig: erklären, dass §52-Forderungen
    der 2-Jahres-Verjährung unterliegen, Heilung künftige Monate senkt, und auf die
    drei Wege verweisen (Clearingstelle-Verfahren, Fachanwalt, BNetzA-Aufsicht).
    Eskalations-Paket anbieten.
  bewertungskriterien:
    - "KEINE Zahlungs-/Verweigerungs-Empfehlung"
    - "Clearingstelle als ersten Weg genannt"
    - "Verjährung nur als Information, nicht als Taktik"
    - "Eskalations-Paket angeboten"

